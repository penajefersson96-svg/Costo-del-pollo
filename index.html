<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E5631">
<title>Inicio · Sistema Avícola</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<script src="style.js"></script>
<script src="fb.js"></script>
<script src="nube.js"></script>
<script src="tutorial.js"></script>
</head>
<body>
<header class="top">
  <div><div class="biz">Mi Granja</div><div class="prod">Sistema avícola</div></div>
  <div class="date"></div>
</header>
<main class="page">
  <div id="alertas"></div>
    <section class="card" id="pendCard" style="display:none">
    <h2>Aprobaciones pendientes</h2>
    <div id="pendList"></div>
  </section>
  <section class="card">
    <h2>Lotes activos</h2>
    <div id="lotesList"></div>
  </section>
  <section class="card">
    <h2>Configuración</h2>
    <div class="field"><label for="negName">Nombre del negocio</label><input type="text" id="negName" placeholder="Mi Granja"></div>
    <button class="btn btn-p btn-w" id="btnNeg" type="button">Guardar nombre</button>
        <button class="btn btn-d btn-w" id="btnReset" type="button" style="margin-top:8px">Empezar de cero </button>
  </section>
  <section class="card">
    <h2>Respaldo</h2>
    <p class="muted">Guarda un archivo con todos tus lotes y restáuralo desde la app cuando quieras.</p>
    <div class="grid2" style="margin-top:10px">
      <button class="btn btn-p" id="btnDown" type="button">Guardar archivo</button>
      <button class="btn btn-g" id="btnFile" type="button">Restaurar archivo</button>
    </div>
    <input type="file" id="bkFile" accept=".json,application/json" hidden>
    <details style="margin-top:12px"><summary class="muted">Opción manual (copiar y pegar)</summary>
      <div class="grid2" style="margin-top:10px">
        <button class="btn btn-g" id="btnExp" type="button">Copiar texto</button>
        <button class="btn btn-g" id="btnImp" type="button">Pegar e importar</button>
      </div>
      <textarea id="bkText" rows="4" style="margin-top:10px" placeholder="Pega aquí un respaldo…"></textarea>
    </details>
  </section>
</main>
<nav class="nav">
  <a href="inicio.html"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V21h-5v-6h-4v6H3z"/></svg><span>Inicio</span></a>
  <a href="calculo2.html"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg><span>Cálculo</span></a>
  <a href="lotes2.html"><svg viewBox="0 0 24 24"><path d="M4 8h16M4 12h16M4 16h16"/></svg><span>Lotes</span></a>
</nav>
<script src="core.js"></script>
<script>
/* ══ Página Inicio ══ */
$('#negName').value=negocio();
$('#btnNeg').onclick=()=>{setNegocio($('#negName').value);toast('Nombre guardado: '+negocio())};
function filaLote(s){
  const r=calcLote(s.data),sem=semaforo(r.mp);
  const lbl=sem==='ok'?'OK':sem==='warn'?'ALERTA':'CRÍTICO';
  return '<div class="item"><div><div class="t">'+esc(s.nombre)+'</div><div class="s">Día '+r.cd+' · '+nf0.format(r.V)+' vivos · mort. '+nf2.format(r.mp)+'%</div></div><div style="text-align:right"><span class="badge b-'+sem+'"><i></i>'+lbl+'</span><div class="s '+(r.gan>=0?'pos':'neg')+'">'+(r.gan>=0?'▲':'▼')+' '+smart(r.gan)+'</div></div></div>';
}
function render(){
  const saved=lotes();
  $('#lotesList').innerHTML=saved.length?saved.map(filaLote).join(''):'<p class="muted">Aún no hay lotes guardados. Créalo en Cálculo.</p>';
  let al='';
  saved.forEach(s=>{const r=calcLote(s.data);if(r.mp>8)al+='<div class="alert">Alerta '+esc(s.nombre)+': mortalidad '+nf2.format(r.mp)+'%, revisa el galpón.</div>'});
  $('#alertas').innerHTML=al;
}
$('#btnDown').onclick=()=>{const url=URL.createObjectURL(new Blob([exportTxt()],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='respaldo-avipro.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Archivo guardado en Descargas')};
$('#btnFile').onclick=()=>$('#bkFile').click();
$('#bkFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const n=importTxt(await f.text());render();toast('Restaurado: '+n+' lotes')}catch(err){toast('Archivo no válido')}e.target.value=''};
$('#btnExp').onclick=()=>{const t=exportTxt();if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast('Respaldo copiado')).catch(()=>{$('#bkText').value=t})}else{$('#bkText').value=t}};
$('#btnImp').onclick=()=>{try{const n=importTxt($('#bkText').value);$('#bkText').value='';render();toast('Respaldo importado: '+n+' lotes')}catch(e){toast('Texto no válido')}};
render();
$('#btnReset').onclick=e=>{const b=e.target;if(b.dataset.arm){localStorage.removeItem('pc_d3');localStorage.removeItem('pc_s3');localStorage.removeItem('pc_inv2');toast('Datos borrados: listo para empezar de verdad');setTimeout(()=>location.reload(),600)}else{b.dataset.arm=1;b.textContent='¿Seguro? Se borra todo lo de este teléfono';setTimeout(()=>{b.textContent='Empezar de cero';delete b.dataset.arm},2500)}};
$('#btnDown').onclick=async()=>{const t=exportTxt();try{const f=new File([t],'respaldo-avipro.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Respaldo'});return}}catch(err){}const url=URL.createObjectURL(new Blob([t],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='respaldo-avipro.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Revisa Descargas o elige dónde guardarlo')};
function ejecutar(clave){
  if(clave==='reset'){localStorage.removeItem('pc_d3');localStorage.removeItem('pc_s3');localStorage.removeItem('pc_inv2');toast('Datos borrados: listo para empezar de verdad');setTimeout(()=>location.reload(),600)}
  if(clave==='nombre'){setNegocio($('#negName').value);toast('Nombre cambiado: '+negocio())}
}
function pintaPend(){
  const s=sesion(),card=$('#pendCard');if(!card)return;
  if(!s||s.rol!=='admin'||!admins().length){card.style.display='none';return}
  const lista=pend().filter(x=>x.por!==s.id);
  card.style.display=lista.length?'block':'none';
  $('#pendList').innerHTML=lista.map(p=>'<div class="item"><div><div class="t">'+esc(p.desc)+'</div><div class="s">Solicita: '+esc(p.porNom)+'</div></div><button class="mini" data-ap="'+esc(p.clave)+'">Aprobar</button></div>').join('');
}
$('#btnReset').onclick=e=>{const b=e.target,ads=admins(),s=sesion();
  if(ads.length&&(!s||s.rol!=='admin')){toast('Solo administradores');return}
  if(ads.length>=2){pedirAccion('reset','Empezar de cero (borrar datos)');pintaPend();return}
  if(b.dataset.arm){ejecutar('reset')}else{b.dataset.arm=1;b.textContent='¿Seguro? Se borra todo';setTimeout(()=>{b.textContent='Empezar de cero (borrar prueba)';delete b.dataset.arm},2500)}};
$('#btnNeg').onclick=()=>{const ads=admins(),s=sesion();
  if(ads.length&&(!s||s.rol!=='admin')){toast('Solo administradores');return}
  if(ads.length>=2){pedirAccion('nombre','Cambiar el nombre del negocio');pintaPend();return}
  setNegocio($('#negName').value);toast('Nombre guardado: '+negocio())};
document.addEventListener('click',e=>{const b=e.target.closest('[data-ap]');if(!b)return;const s=sesion();if(!s||s.rol!=='admin'){toast('Solo administradores');return}ejecutar(b.dataset.ap);aprobarAccion(b.dataset.ap);pintaPend();toast('Aprobado y ejecutado')});
pintaPend();
(function(){
  const s=sesion();if(!s||s.rol==='admin')return;
  const cfg=$('#btnNeg');if(cfg)cfg.closest('.card').style.display='none';
  const bk=$('#btnDown');if(bk)bk.closest('.card').style.display='none';
  document.querySelectorAll('#lotesList .pos,#lotesList .neg').forEach(el=>el.style.display='none');
})();
$('#btnDown').onclick=async()=>{
  const t=exportTxt();
  try{const f=new File([t],'respaldo-avipro.json',{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Respaldo'});return}}catch(e){}
  try{const url=URL.createObjectURL(new Blob([t],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='respaldo-avipro.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}catch(e){}
  $('#bkText').value=t;toast('Si no descargó: el respaldo quedó en el cuadro manual; cópialo y guárdalo en Drive o Notas');
};
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
  let r=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(r)toast('App actualizada');r=true});
}
</script>
</body>
</html>
